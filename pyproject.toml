[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stdnet-research"
version = "0.1.0"
description = "Spatial-temporal dual-branch learning for network anomaly detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0,<3",
  "torch-geometric>=2.3,<3",
  "numpy>=1.24,<3",
  "pandas>=1.5,<3",
  "scikit-learn>=1.2,<2",
]

[project.scripts]
stdnet = "stdnet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
